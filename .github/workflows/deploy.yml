name: Test & Deploy

# When this runs:
#  - on every push to main and every pull request -> run the tests
#  - on pushes to main that pass tests           -> publish to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:

# Permissions the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't run two deploys at once; cancel an in-progress one if a new push lands.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No dependencies to install — just run the built-in test runner.
      - run: npm test

  deploy:
    needs: test # only deploy if the tests job succeeded
    if: github.ref == 'refs/heads/main' # deploy from main only (not PRs)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: . # the whole repo is the static site (index.html is at the root)
      - id: deployment
        uses: actions/deploy-pages@v4
